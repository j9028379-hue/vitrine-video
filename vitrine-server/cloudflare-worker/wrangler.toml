name = "vitrine-video-control-plane"
main = "src/worker.mjs"
compatibility_date = "2026-02-01"
workers_dev = false
preview_urls = false

# 1. Cloudflare D1 (Free tier: 5 GB, 5M reads/day, 100k writes/day)
[[d1_databases]]
binding = "DB"
database_name = "vitrine_prod_db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# 2. Cloudflare R2 private buckets (Free tier: 10 GB-mo, 1M Class A, 10M Class B, $0 egress)
# IMPORTANT:
# - Keep public access DISABLED on both buckets.
# - Configure R2 Lifecycle Rules on vitrine-renders-private:
#     * prefix "uploads/"  -> expire after 1 day (24h)
#     * prefix "outputs/"  -> expire after 2 days (48h)
#     * prefix "previews/" -> expire after 1 day (24h)
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "vitrine-assets-private"

[[r2_buckets]]
binding = "RENDERS_BUCKET"
bucket_name = "vitrine-renders-private"

# 3. Cloudflare Queues (Free tier since Feb 2026: 10,000 ops/day, HTTP pull supported)
[[queues.producers]]
binding = "RENDER_QUEUE"
queue = "vitrine-render-jobs"

[vars]
ENVIRONMENT = "production"
R2_ASSETS_BUCKET_NAME = "vitrine-assets-private"
R2_RENDERS_BUCKET_NAME = "vitrine-renders-private"
PRESIGNED_PUT_TTL_SEC = "600"
PRESIGNED_GET_TTL_SEC = "900"
DEFAULT_FREE_CREDITS = "1"
MAX_SCENE_BYTES = "26214400"
MAX_PROXY_RENDERS_PER_SESSION = "3"
MAX_PROXY_RENDERS_PER_HOUR = "12"
MAX_FINAL_RENDERS_PER_HOUR = "20"

# Required secrets (configure via `wrangler secret put <NAME>`, NEVER commit):
# - CLOUDFLARE_ACCOUNT_ID
# - R2_ACCESS_KEY_ID
# - R2_SECRET_ACCESS_KEY
# - DEVICE_TOKEN_HMAC_SECRET
# - WORKER_HMAC_SECRET
# - FEDAPAY_WEBHOOK_SECRET
# - KKIAPAY_WEBHOOK_SECRET
# - CINETPAY_WEBHOOK_SECRET
