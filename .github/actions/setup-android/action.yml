name: Setup Android SDK 35
description: Install or reuse Android SDK command-line tools, Platform 35 and Build Tools 35 on a fresh runner

runs:
  using: composite
  steps:
    - name: Resolve, install and verify SDK packages
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${ANDROID_HOME:-}" ]; then
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          else
            export ANDROID_HOME="$HOME/Android/Sdk"
          fi
        fi
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        mkdir -p "$ANDROID_HOME"

        SDKMGR=""
        if command -v sdkmanager >/dev/null 2>&1; then
          SDKMGR="$(command -v sdkmanager)"
        else
          SDKMGR="$(find "$ANDROID_HOME" -type f -path '*/bin/sdkmanager' 2>/dev/null | head -n 1 || true)"
        fi

        if [ -z "$SDKMGR" ]; then
          echo "No sdkmanager found; installing command-line tools"
          curl -fsSL --retry 3 -o /tmp/commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline-tools-unpack
          mkdir -p /tmp/cmdline-tools-unpack
          unzip -q /tmp/commandlinetools.zip -d /tmp/cmdline-tools-unpack
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -a /tmp/cmdline-tools-unpack/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        fi

        chmod +x "$SDKMGR"
        yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
        "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        "$SDKMGR" --list_installed | grep -E 'platforms;android-35|build-tools;35\.0\.0|platform-tools'
        echo "SDKMANAGER=$SDKMGR" >> "$GITHUB_ENV"
