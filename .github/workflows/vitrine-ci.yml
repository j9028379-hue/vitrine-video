name: Vitrine Video CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/_android-ci.yml
    # Founder decision 2026-11-25: physical phone testing replaces the GitHub
    # emulator probe. The instrumented test and reusable render job are kept in
    # source but are never invoked from this entry workflow.
    with:
      run_render: false
