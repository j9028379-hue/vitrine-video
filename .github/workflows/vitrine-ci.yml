name: Vitrine Video CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pipeline:
    uses: ./.github/workflows/_android-ci.yml
    # Run the deterministic emulator render on repository engineering fixtures;
    # founder footage and physical-device intelligibility remain a separate check.
    with:
      run_render: true
