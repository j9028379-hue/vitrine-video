name: Vitrine Video — reusable Android CI

on:
  workflow_call:
    inputs:
      run_render:
        description: "Render synthetic T3/T4 reference proofs without requiring an emulator"
        type: boolean
        default: false
      allow_apk_delivery:
        description: "Enable APK transfer packaging only after all visual/audio delivery criteria are accepted"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx1g"

jobs:
  t2-package:
    name: T2/T5 packages, SHA and internal music evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate RESTAURATION-T3 package from official source archive
        run: python3 tools/build_restauration_t3_package.py

      - name: Verify COMMERCE-T2 package, manifest, vault and mix
        run: python3 tools/verify_t2_integrity.py

      - name: Verify RESTAURATION-T2 archive inventory, package and sealed music
        run: python3 tools/verify_restauration_t2_integrity.py

      - name: Verify RESTAURATION-T5 archive inventory, package and sealed music
        run: python3 tools/verify_restauration_t5_integrity.py

      - name: Verify RESTAURATION-T3 selective package, v0.4 contract and sealed music
        run: python3 tools/verify_restauration_t3_integrity.py

      - name: Prove T5 typography weights and transition travel
        run: |
          python3 -m pip install --quiet fonttools pillow
          python3 tools/prove_t5_typography_and_transitions.py

      - name: Upload T2/T5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-t5-package-evidence
          path: |
            ci-artifacts/T2_INTEGRITY_REPORT.txt
            ci-artifacts/RESTAURATION_T2_INTEGRITY_REPORT.txt
            ci-artifacts/T5_INTEGRITY_REPORT.txt
            ci-artifacts/RESTAURATION_T3_INTEGRITY_REPORT.txt
            docs/restauration_t5/proofs/T5_TYPOGRAPHY_PROOF.png
            docs/restauration_t5/proofs/T5_TYPOGRAPHY_REPORT.txt
            docs/restauration_t5/proofs/T5_TRANSITIONS_REPORT.txt
          if-no-files-found: warn

  tests:
    name: JVM test suites
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK Platform 35 + Build Tools
        uses: ./.github/actions/setup-android

      - name: local.properties (generated, never committed)
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          test -s local.properties

      - name: Gradle wrapper 8.10.2 + cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Wrapper sanity
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Engine unit tests
        shell: bash
        run: |
          set +e
          mkdir -p ci-logs
          ./gradlew :vitrine-render-engine:testDebugUnitTest --stacktrace 2>&1 | tee ci-logs/engine-tests.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E '^(e:|w:|FAILURE:|.* FAILED|.*error:)' ci-logs/engine-tests.log | tail -25 | while IFS= read -r line; do
              echo "::error::${line//'%'/'%25'}"
            done
          fi
          exit "$code"

      - name: App unit tests
        shell: bash
        run: |
          set +e
          mkdir -p ci-logs
          ./gradlew :vitrine-video-app:testDebugUnitTest --stacktrace 2>&1 | tee ci-logs/app-tests.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E '^(e:|w:|FAILURE:|.* FAILED|.*error:)' ci-logs/app-tests.log | tail -25 | while IFS= read -r line; do
              echo "::error::${line//'%'/'%25'}"
            done
          fi
          exit "$code"

      - name: JUnit XML summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total=fail=err=skip=0
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              r=ET.parse(f).getroot()
              total+=int(r.get('tests') or 0); fail+=int(r.get('failures') or 0)
              err+=int(r.get('errors') or 0); skip+=int(r.get('skipped') or 0)
          print(f'::notice::JUNIT_TOTAL={total} FAILURES={fail} ERRORS={err} SKIPPED={skip}')
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              r=ET.parse(f).getroot()
              for case in r.iter('testcase'):
                  for kind in ('failure','error'):
                      for node in case.findall(kind):
                          msg=(node.get('message') or node.text or '').replace('\n',' ').replace('%','%25')
                          print(f"::error::{case.get('classname')}.{case.get('name')}: {msg}")
          PY

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            vitrine-render-engine/build/outputs/audio-validation/**
            vitrine-render-engine/build/outputs/render-validation/**
          if-no-files-found: warn

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ci-logs/**
          if-no-files-found: warn

  build:
    name: Debug + release APK
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK Platform 35 + Build Tools
        uses: ./.github/actions/setup-android

      - name: local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: assembleDebug + assembleRelease
        run: |
          set -o pipefail
          mkdir -p ci-logs
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee ci-logs/gradle-build.log

      - name: APK integrity, signature and SHA-256
        run: |
          set -euo pipefail
          exec > >(tee ci-logs/apk-verification.log) 2>&1
          mkdir -p ci-artifacts
          : > ci-artifacts/SHA256SUMS.txt
          DEBUG_APK=$(find . -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)
          RELEASE_APK=$(find . -path '*/build/outputs/apk/release/*.apk' -type f | head -n 1)
          test -n "$DEBUG_APK" && test -s "$DEBUG_APK"
          test -n "$RELEASE_APK" && test -s "$RELEASE_APK"
          cp "$DEBUG_APK" ci-artifacts/VitrineVideo-debug.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose ci-artifacts/VitrineVideo-debug.apk
          if [[ "$RELEASE_APK" == *unsigned* ]]; then
            # CI-only verification key: never committed, never used for a store build.
            keytool -genkeypair -keystore ci-artifacts/ci-only.jks \
              -storepass vitrine-ci-only -keypass vitrine-ci-only \
              -alias ci-only -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=Vitrine CI verification only" >/dev/null 2>&1
            cp "$RELEASE_APK" ci-artifacts/VitrineVideo-release-ci-signed.apk
            "$APKSIGNER" sign --ks ci-artifacts/ci-only.jks \
              --ks-pass pass:vitrine-ci-only --key-pass pass:vitrine-ci-only \
              ci-artifacts/VitrineVideo-release-ci-signed.apk >/dev/null 2>&1
          else
            cp "$RELEASE_APK" ci-artifacts/VitrineVideo-release.apk
          fi
          rm -f ci-artifacts/ci-only.jks
          for f in ci-artifacts/*.apk; do
            size=$(stat -c '%s' "$f")
            stat -c '%n %s bytes' "$f"
            echo "::notice::APK_SIZE_BYTES $size $(basename "$f")"
            sha256sum "$f" >> ci-artifacts/SHA256SUMS.txt
          done
          "$APKSIGNER" verify --verbose ci-artifacts/VitrineVideo-release*.apk
          cat ci-artifacts/SHA256SUMS.txt
          while IFS= read -r line; do echo "::notice::APK_SHA256 $line"; done < ci-artifacts/SHA256SUMS.txt

      - name: Audit release APK for T3 package integrity and excluded demo assets
        run: |
          set -euo pipefail
          RELEASE_DELIVERY=$(find ci-artifacts -maxdepth 1 -name 'VitrineVideo-release*.apk' -type f | head -n 1)
          test -n "$RELEASE_DELIVERY"
          python3 tools/verify_restauration_t3_apk.py "$RELEASE_DELIVERY" | tee ci-artifacts/RESTAURATION_T3_APK_AUDIT.txt
          python3 tools/verify_restauration_t1_integrity.py "$RELEASE_DELIVERY" | tee ci-artifacts/RESTAURATION_T1_APK_AUDIT.txt

      - name: Upload APKs and integrity report
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-evidence
          path: ci-artifacts/*
          if-no-files-found: error

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci-logs/**
          if-no-files-found: warn

  delivery-package:
    name: Downloadable Release APK transfer artifact
    # APK transfer is independent of emulator availability; the Android render remains a separate non-release-gating diagnostic.
    needs: [tests, build, render]
    if: ${{ !cancelled() && inputs.allow_apk_delivery && needs.tests.result == 'success' && needs.build.result == 'success' && needs.render.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download this run's APK evidence
        uses: actions/download-artifact@v4
        with:
          name: apk-release-evidence
          path: ci-delivery/source

      - name: Prepare standalone Release APK and provenance
        run: |
          set -euo pipefail
          RELEASE_APK=$(find ci-delivery/source -maxdepth 1 -type f -name 'VitrineVideo-release*.apk' -print -quit)
          test -n "$RELEASE_APK" && test -s "$RELEASE_APK"
          mkdir -p ci-delivery/release-only
          cp "$RELEASE_APK" ci-delivery/release-only/VitrineVideo-release.apk
          cp ci-delivery/source/SHA256SUMS.txt ci-delivery/release-only/SHA256SUMS-all-apks.txt
          cp ci-delivery/source/RESTAURATION_T3_APK_AUDIT.txt ci-delivery/release-only/
          cp ci-delivery/source/RESTAURATION_T1_APK_AUDIT.txt ci-delivery/release-only/
          {
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            echo "apk_name=VitrineVideo-release.apk"
            stat -c 'apk_size_bytes=%s' ci-delivery/release-only/VitrineVideo-release.apk
            sha256sum ci-delivery/release-only/VitrineVideo-release.apk | awk '{print "apk_sha256="$1}'
            if [[ "$RELEASE_APK" == *ci-signed.apk ]]; then
              echo "signature=CI verification signature only; not a Play Store production signature"
            else
              echo "signature=Release signature reported by the build audit; verify provenance in the included audit"
            fi
          } > ci-delivery/release-only/DELIVERY_MANIFEST.txt
          sha256sum ci-delivery/release-only/VitrineVideo-release.apk > ci-delivery/release-only/SHA256SUMS.txt
          cat ci-delivery/release-only/DELIVERY_MANIFEST.txt
          cat ci-delivery/release-only/SHA256SUMS.txt

      - name: Upload standalone Release APK transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-transfer
          path: ci-delivery/release-only/*
          if-no-files-found: error
          retention-days: 30

  android-render:
    name: Android emulator T3 render and decoded-frame evidence
    needs: tests
    # Prefer the Apple Silicon macOS runner so the ARM64 Android system image
    # runs natively through Hypervisor.framework rather than emulating x86_64.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK Platform 35 + Build Tools
        uses: ./.github/actions/setup-android

      - name: local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Check Android runner acceleration and capacity
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            ACCELERATION=Hypervisor.framework
            CPU_ARCH=$(uname -m)
            CPU_COUNT=$(sysctl -n hw.ncpu)
            MEMORY_MIB=$(sysctl -n hw.memsize | awk '{print int($1/1024/1024)}')
            FREE_DISK=$(df -m "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          else
            CPU_ARCH=$(uname -m)
            ACCELERATION=unavailable
            if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCELERATION=KVM; fi
            CPU_COUNT=$(nproc)
            MEMORY_MIB=$(awk '/MemAvailable:/ {print int($2/1024)}' /proc/meminfo)
            FREE_DISK=$(df -Pm "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          fi
          echo "::notice::Android runner diagnostics: host_acceleration=$ACCELERATION arch=$CPU_ARCH CPU=$CPU_COUNT memory_available_mib=$MEMORY_MIB free_disk_mib=$FREE_DISK"
          df -h "$RUNNER_TEMP"

      - name: Prepare Android instrumentation runner script
        run: |
          cat > "$RUNNER_TEMP/android-t3-instrumentation.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p ci-artifacts/android-t3
          capture_live_emulator_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              adb devices -l > ci-artifacts/android-t3/live-adb-devices.log 2>&1 || true
              adb logcat -b all -d > ci-artifacts/android-t3/live-logcat.log 2>&1 || true
              ps auxww | grep -E '[e]mulator|[q]emu|[a]db' > ci-artifacts/android-t3/live-emulator-processes.log || true
              for log in ci-artifacts/android-t3/install-test-apk.log ci-artifacts/android-t3/connected-tests.log; do
                [ -f "$log" ] || continue
                tail -n 80 "$log" >> "$GITHUB_STEP_SUMMARY"
                while IFS= read -r line; do
                  safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
                  echo "::notice title=Live Android failure log::$safe"
                done < <(tail -n 40 "$log")
              done
              for log in ci-artifacts/android-t3/live-adb-devices.log ci-artifacts/android-t3/live-emulator-processes.log; do
                while IFS= read -r line; do
                  safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
                  echo "::notice title=Live Android failure log::$safe"
                done < "$log"
              done
              tail -n 100 ci-artifacts/android-t3/live-logcat.log | while IFS= read -r line; do
                safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
                echo "::notice title=Live Android logcat::$safe"
              done
            fi
            return "$status"
          }
          trap capture_live_emulator_failure EXIT
          chmod +x gradlew
          adb wait-for-device
          set +e
          ./gradlew :vitrine-render-engine:installDebugAndroidTest --stacktrace 2>&1 | tee ci-artifacts/android-t3/install-test-apk.log
          INSTALL_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            tail -n 100 ci-artifacts/android-t3/install-test-apk.log | sed 's/^/::error::/'
            exit "$INSTALL_STATUS"
          fi
          ROOT=/sdcard/Android/data/com.vitrinevideo.engine/files/t3_fixture
          adb shell mkdir -p "$ROOT/captures" "$ROOT/music/RESTAURATION-T3/1.0.0"
          adb push vitrine-video-app/src/main/assets/packages/RESTAURATION-T3-1.0.0.zip "$ROOT/RESTAURATION-T3-1.0.0.zip"
          adb push test-fixtures/t3_fixture/captures/. "$ROOT/captures/"
          adb push vitrine-video-app/src/main/assets/music/RESTAURATION-T3/1.0.0/. "$ROOT/music/RESTAURATION-T3/1.0.0/"
          set +e
          ./gradlew :vitrine-render-engine:connectedDebugAndroidTest --stacktrace 2>&1 | tee ci-artifacts/android-t3/connected-tests.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          adb pull "$ROOT/android_evidence" ci-artifacts/android-t3/ || true
          if [ "$TEST_STATUS" -ne 0 ]; then
            echo "### Android instrumentation failure details" >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 ci-artifacts/android-t3/connected-tests.log >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 ci-artifacts/android-t3/connected-tests.log | sed 's/^/::error::/'
          fi
          if [ "$TEST_STATUS" -eq 0 ]; then
            test -s ci-artifacts/android-t3/android_evidence/android_decoded_frame_evidence.json
            test -s ci-artifacts/android-t3/android_evidence/transition_probe.json
            test -s ci-artifacts/android-t3/android_evidence/source_execution_matrix.json
            python3 -c 'import json,pathlib; r=pathlib.Path("ci-artifacts/android-t3/android_evidence"); d=json.loads((r/"android_decoded_frame_evidence.json").read_text()); m=json.loads((r/"source_execution_matrix.json").read_text()); assert d["evidence_kind"]=="android_emulator_media3_gl_mp4_decode" and d["fidelity_claim"] is False and len(d["frames"])>=45; assert all(f["decoded_width"]>0 and f["decoded_height"]>0 and len(f["sample"]["rgba_sample_sha256"])==64 for f in d["frames"]); assert len({f["sample"]["rgba_sample_sha256"] for f in d["frames"]})>5; assert m["status"]=="INCOMPLETE_PROFILE_EXECUTION" and len(m["transitions"])==17; assert all(p["android_property_execution_observed"] is False for t in m["transitions"] for p in t["source_properties"]); print("Android MP4 decoded frame samples:",len(d["frames"]))'
          fi
          exit "$TEST_STATUS"
          SCRIPT
          chmod +x "$RUNNER_TEMP/android-t3-instrumentation.sh"

      - name: Prepare emulator startup logger
        run: |
          cat > "$RUNNER_TEMP/prepare-emulator-wrapper.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          EMULATOR_BIN="$ANDROID_HOME/emulator/emulator"
          mv "$EMULATOR_BIN" "$EMULATOR_BIN.vitrine-real"
          cat > "$EMULATOR_BIN" <<'WRAPPER'
          #!/bin/bash
          exec "$0.vitrine-real" "$@" >> "${RUNNER_TEMP}/vitrine-emulator-startup.log" 2>&1
          WRAPPER
          chmod +x "$EMULATOR_BIN"
          SCRIPT
          chmod +x "$RUNNER_TEMP/prepare-emulator-wrapper.sh"

      - name: Run Android instrumentation on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: arm64-v8a
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -verbose -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072 -cores 2
          disable-animations: true
          pre-emulator-launch-script: bash "$RUNNER_TEMP/prepare-emulator-wrapper.sh"
          script: |
            exec bash "$RUNNER_TEMP/android-t3-instrumentation.sh"

      - name: Capture Android emulator boot or instrumentation diagnostics
        if: failure()
        run: |
          mkdir -p ci-artifacts/android-t3
          python3 - <<'PY'
          import os
          import subprocess
          from collections import deque
          from pathlib import Path

          root = Path("ci-artifacts/android-t3")
          commands = {
              "adb-devices.log": ["adb", "devices", "-l"],
              "avd-list.log": [os.path.join(os.environ.get("ANDROID_HOME", ""), "emulator", "emulator"), "-list-avds"],
              "emulator-processes.log": ["ps", "auxww"],
              "logcat.log": ["adb", "logcat", "-b", "all", "-d"],
          }
          for filename, command in commands.items():
              try:
                  result = subprocess.run(command, text=True, stdout=subprocess.PIPE,
                                          stderr=subprocess.STDOUT, timeout=20, check=False)
                  output = result.stdout
                  if filename == "emulator-processes.log":
                      output = "\n".join(line for line in output.splitlines()
                                           if any(token in line for token in ("emulator", "qemu", "adb")))
                  output += f"\n[exit={result.returncode}]\n"
              except subprocess.TimeoutExpired as exc:
                  partial = exc.stdout or ""
                  if isinstance(partial, bytes):
                      partial = partial.decode(errors="replace")
                  output = f"{partial}\n[diagnostic timed out after 20 seconds]\n"
              except Exception as exc:
                  output = f"[diagnostic failed: {type(exc).__name__}: {exc}]\n"
              (root / filename).write_text(output)
          startup_log = Path(os.environ.get("RUNNER_TEMP", "")) / "vitrine-emulator-startup.log"
          if startup_log.is_file():
              with startup_log.open(errors="replace") as source:
                  startup_tail = deque(source, maxlen=500)
              (root / "emulator-startup.log").write_text("".join(startup_tail))
          summary = ["### Android runner failure diagnostics", "```text"]
          log_files = [root / name for name in commands]
          log_files += [root / "install-test-apk.log", root / "connected-tests.log", root / "emulator-startup.log"]
          for path in log_files:
              if not path.is_file():
                  continue
              summary.append(f"--- {path.name} ---")
              text = path.read_text(errors="replace").splitlines()
              summary.extend(text[-150:])
              for line in text[-30:]:
                  safe = line.replace("%", "%25").replace("\\r", "")
                  print(f"::notice title=Android runner diagnostic::{path.name}: {safe}")
          summary.append("```")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("\n".join(summary) + "\n")
          PY

      - name: Upload Android-emulator render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-t3-render-evidence
          path: ci-artifacts/android-t3/**
          if-no-files-found: warn

  render:
    name: Synthetic T3/T4 reference renders and evidence
    needs: build
    if: ${{ inputs.run_render }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic host render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow opencv-python-headless imageio-ffmpeg
          npm install --prefix "$RUNNER_TEMP/ffprobe" --no-audit --no-fund ffprobe-static
          FFPROBE_BIN=$(node -p "require('$RUNNER_TEMP/ffprobe/node_modules/ffprobe-static').path")
          echo "FFPROBE_BIN=$FFPROBE_BIN" >> "$GITHUB_ENV"

      - name: Render synthetic T3/T4 with checked-in Python references
        run: python tools/render_synthetic_reference_renders.py

      - name: Extract control frames, frame maps, ffprobe metadata and SHA-256
        run: python tools/build_synthetic_render_evidence.py

      - name: Download JVM audio DSP evidence
        uses: actions/download-artifact@v4
        with:
          name: junit-reports
          path: render-evidence/synthetic/audio-ci

      - name: Collect and verify synthetic Kotlin audio evidence
        run: python tools/collect_ci_audio_evidence.py

      - name: Verify evidence completeness and no empty-artifact pass
        run: |
          set -euo pipefail
          test -s render-evidence/synthetic/T3/EVIDENCE_SCOPE.json
          test -s render-evidence/synthetic/T3/contact-sheet.jpg
          test -s render-evidence/synthetic/T3/frame-map.csv
          test -s render-evidence/synthetic/T3/T3_SILENT_RENDER_REPORT.json
          test -s render-evidence/synthetic/T4/EVIDENCE_SCOPE.json
          test -s render-evidence/synthetic/T4/contact-sheet.jpg
          test -s render-evidence/synthetic/T4/frame-map.csv
          test -s render-evidence/synthetic/audio/T3_SYNTHETIC_AUDIO_REPORT.json
          test -s render-evidence/synthetic/audio/T3_SYNTHETIC_VOICE_PRIORITY.wav
          test -s render-evidence/synthetic/SHA256SUMS.txt
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('render-evidence/synthetic')
          t3=json.loads((root/'T3/EVIDENCE_SCOPE.json').read_text())
          t4=json.loads((root/'T4/EVIDENCE_SCOPE.json').read_text())
          audio=json.loads((root/'audio/T3_SYNTHETIC_AUDIO_REPORT.json').read_text())
          assert t3['all_transition_events_executed'] and len(t3['transition_execution_counts']) == 17
          assert t3['all_text_groups_executed'] and t3['text_motion_groups'] == 4
          assert t4['camera_cut_events'] == 26 and t4['text_windows'] == 7
          assert audio['status'] == 'PASS_SYNTHETIC_DSP_ONLY'
          assert 0.35 <= audio['measured']['phrase_music_to_baseline_ratio'] <= 0.52
          assert audio['measured']['strong_voice_440hz_tone_amplitude'] > audio['measured']['weak_voice_440hz_tone_amplitude'] * 5
          assert audio['measured']['max_peak_dbfs'] <= -1.95
          assert all(p.stat().st_size > 0 for p in [root/'T3/contact-sheet.jpg', root/'T4/contact-sheet.jpg', root/'T3/frame-map.csv', root/'T4/frame-map.csv', root/'audio/T3_SYNTHETIC_VOICE_PRIORITY.wav'])
          PY
          (cd render-evidence/synthetic && sha256sum -c SHA256SUMS.txt)
          cat render-evidence/synthetic/T3/EVIDENCE_SCOPE.json
          cat render-evidence/synthetic/T4/EVIDENCE_SCOPE.json

      - name: Upload synthetic render and audio-independent render evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-t3-t4-render-evidence
          path: render-evidence/synthetic/**
          if-no-files-found: error
