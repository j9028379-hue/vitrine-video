name: Publish single T2 Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Reassemble CI-validated APK and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify CI APK
        run: |
          set -euo pipefail
          mkdir -p delivery-single
          cat ci-delivery/apk-chunks/VitrineVideo-release-ci-signed.apk.part-* \
            > delivery-single/VitrineVideo-release-ci-signed.apk
          test "$(stat -c %s delivery-single/VitrineVideo-release-ci-signed.apk)" = "125564647"
          echo "40e9d70fe80ea74be1bbb99c30cb15479ff5e4f0382ee5bb4d78f99b7fcf9381  delivery-single/VitrineVideo-release-ci-signed.apk" | sha256sum -c -

      - name: Attach single APK to public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload t2-single-apk \
            delivery-single/VitrineVideo-release-ci-signed.apk \
            --clobber --repo "$GH_REPO"
          gh release view t2-single-apk --repo "$GH_REPO" --json assets
